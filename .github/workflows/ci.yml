name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

# Push mới lên cùng nhánh huỷ lần chạy trước, khỏi xếp hàng vô ích.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres thật để chạy được `migrate deploy` — bước này xác nhận migration
    # đã commit thực sự áp được, thứ mà typecheck không nhìn thấy.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: base_template_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Redis thật để bước seed/migrate chạy đúng đường đi của production
      # (cache và rate limit dùng chung), thay vì âm thầm rơi về bản RAM.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/base_template_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-characters-long
      CORS_ORIGIN: "*"
      APP_URL: http://localhost:3000
      # Khoá GIẢ cho CI — chỉ để các test mã hoá/2FA chạy được.
      ENCRYPTION_KEY: ci-encryption-key-not-used-anywhere-real
      # Job chạy thẳng trong tiến trình: CI không dựng worker, và một job bị
      # đẩy vào Redis rồi không ai xử lý sẽ làm bước seed treo.
      QUEUE_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      # Không ghim version: action đọc trường `packageManager` trong
      # package.json, nên CI và máy dev không thể lệch nhau.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo cache: không có nó thì mọi lần chạy đều build lại từ đầu.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Prisma generate
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:deploy

      # Seed là một phần của mọi lần deploy (xem deploy-vps.sh), nên nó phải
      # được kiểm ở CI. Một seed hỏng chỉ lộ ra lúc deploy thì đã quá muộn.
      - name: Seed (quyền + vai trò hệ thống)
        run: pnpm db:seed

      - name: Format check
        run: pnpm prettier --check "**/*.{ts,tsx,md,json,yml,yaml}"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  docker:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Dockerfile hỏng chỉ lộ ra lúc deploy nếu CI không tự build thử.
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
