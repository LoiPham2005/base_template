# `version:` đã bị Compose v2 bỏ và chỉ sinh cảnh báo nếu còn giữ.
#
# Chạy toàn bộ:      docker compose up -d
# Chỉ hạ tầng (dev): docker compose up -d postgres redis mailpit
#
# Biến đọc từ file `.env` ở cùng thư mục — xem `.env.example`.

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-base_template}?schema=public}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  QUEUE_ENABLED: ${QUEUE_ENABLED:-1}
  NODE_ENV: production

services:
  postgres:
    image: postgres:16-alpine
    container_name: base_template_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-base_template}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-base_template}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: base_template_redis
    restart: unless-stopped
    # `appendonly yes`: hàng đợi job nằm trong Redis. Không bật ghi bền thì
    # restart container là mất mọi job đang chờ — email chưa gửi biến mất mà
    # không dòng log nào báo.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Máy chủ SMTP giả cho DEV: bắt mọi email và hiện trên giao diện web ở
  # http://localhost:8025 — không thư nào ra Internet thật.
  #
  # Chỉ chạy khi gọi tên hoặc `--profile dev`, để `docker compose up -d` trên
  # production không vô tình dựng nó.
  mailpit:
    image: axllent/mailpit:latest
    container_name: base_template_mailpit
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "8025:8025"
      - "1025:1025"

  # Chạy MỘT LẦN rồi thoát; `api` và `worker` đợi nó kết thúc thành công.
  # Không có service này thì schema không bao giờ được áp, database rỗng vĩnh
  # viễn, và mọi query lỗi ngay từ request đầu tiên.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: installer
    container_name: base_template_migrate
    restart: "no"
    working_dir: /app/packages/db
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: base_template_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      PORT: 3001
      # BẮT BUỘC, không có mặc định: thiếu thì container dừng ngay kèm thông
      # báo rõ ràng, thay vì âm thầm ký JWT bằng một khoá ai cũng biết.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET là bắt buộc — sinh bằng openssl rand -base64 48}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN là bắt buộc trên production}
      APP_URL: ${APP_URL:?APP_URL là bắt buộc — dùng cho link trong email và callback OAuth}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      # Bỏ trống thì 2FA không bật được; phần còn lại vẫn chạy. Không dùng
      # `:?` như JWT_SECRET vì đây là tính năng tuỳ chọn, không phải điều kiện
      # để hệ thống hoạt động.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      APP_NAME: ${APP_NAME:-Base Template}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
      PHONE_VERIFICATION_ENABLED: ${PHONE_VERIFICATION_ENABLED:-0}
    # Cố ý KHÔNG publish cổng 3001: chỉ `web` và reverse proxy cần gọi API. Mở
    # ra Internet là đi vòng qua cả TLS lẫn rate limit của proxy.
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      WORKER_HEALTH_PORT: 3002
      APP_URL: ${APP_URL:?APP_URL là bắt buộc — worker dựng link trong email}
      APP_NAME: ${APP_NAME:-Base Template}
      PHONE_VERIFICATION_ENABLED: ${PHONE_VERIFICATION_ENABLED:-0}
    # `QUEUE_ENABLED=0` là container này KHÔNG được dựng, và `docker compose
    # up -d` sẽ GỠ nó nếu đang chạy. Dùng chung một biến với app là để không
    # bao giờ có chuyện app đẩy job vào Redis trong khi không worker nào chạy.
    deploy:
      replicas: ${QUEUE_ENABLED:-1}
    # Job đang chạy dở cần thời gian hoàn tất. Mặc định Docker chỉ đợi 10 giây
    # rồi SIGKILL — cắt ngang một job đã trừ tiền nhưng chưa ghi nhận.
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: base_template_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: ${API_URL:-http://api:3001}
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
  redis_data:
